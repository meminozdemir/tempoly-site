    <rect x="76" y="14" width="64" height="7" rx="3.5" fill="#ecebff" opacity="0.8"/>
    <rect x="76" y="28" width="60" height="7" rx="3.5" fill="#ecebff" opacity="0.4"/>
    <rect x="76" y="42" width="48" height="7" rx="3.5" fill="#ecebff" opacity="0.4"/>
