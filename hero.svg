      <path d="M14 9v14a4 4 0 1 1-4-4" fill="none" stroke="#ecebff" stroke-width="2" stroke-linecap="round"/>
      <path d="M14 9c1 3 3 5 6 5" fill="none" stroke="#ecebff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(84 14)">
      <rect width="34" height="34" rx="9" fill="#ffffff" opacity="0.08"/>
      <path d="M10 10l14 14M24 10L10 24" stroke="#ecebff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(126 14)">
      <rect width="34" height="34" rx="9" fill="#ffffff" opacity="0.08"/>
      <rect x="8" y="11" width="18" height="12" rx="4" fill="none" stroke="#ecebff" stroke-width="2"/>
      <path d="M15 14l5 3-5 3z" fill="#ecebff"/>
    </g>
