    <rect x="12" y="14" width="120" height="7" rx="3.5" fill="#ecebff" opacity="0.8"/>
    <rect x="12" y="28" width="128" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="42" width="96" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="56" width="112" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="84" width="40" height="18" rx="9" fill="#a78bfa" opacity="0.2"/>
