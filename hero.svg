<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12122a"/>
      <stop offset="1" stop-color="#0a0a16"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="img1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="img2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="img3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="520" fill="#0d0d1d"/>
  <rect x="220" y="0" width="1" height="520" fill="#ffffff" opacity="0.06"/>
  <rect x="24" y="28" width="30" height="30" rx="8" fill="url(#acc)"/>
  <path d="M32 38h14M39 38v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="49" fill="#ecebff" font-size="18" font-weight="700">Tempoly</text>

  <g fill="#9b9bb8" font-size="14">
    <rect x="16" y="88" width="188" height="36" rx="10" fill="#ffffff" opacity="0.08"/>
    <text x="32" y="111" fill="#ecebff" font-weight="600">Calendar</text>
    <text x="32" y="155">Queue</text>
    <text x="32" y="195">Brand voice</text>
    <text x="32" y="235">Channels</text>
    <text x="32" y="275">Analytics</text>
  </g>

  <!-- automation status card -->
  <rect x="16" y="396" width="188" height="96" rx="14" fill="#ffffff" opacity="0.05"/>
  <circle cx="38" cy="424" r="6" fill="#22c55e" filter="url(#glow)"/>
  <text x="52" y="429" fill="#ecebff" font-size="13" font-weight="600">Autopilot on</text>
  <text x="32" y="454" fill="#9b9bb8" font-size="12">Next run: tomorrow 07:00</text>
  <text x="32" y="474" fill="#9b9bb8" font-size="12">5 channels · 3 posts/day</text>

  <!-- header -->
  <text x="252" y="52" fill="#ecebff" font-size="22" font-weight="700">This week</text>
  <rect x="1040" y="30" width="128" height="34" rx="17" fill="url(#acc)"/>
  <text x="1104" y="52" fill="#0a0a14" font-size="13" font-weight="700" text-anchor="middle">Generate now</text>

  <!-- day columns -->
  <g font-size="12" fill="#9b9bb8" font-weight="600">
