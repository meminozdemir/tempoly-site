    <text x="76" y="72" fill="#6b6b88" font-size="11" text-anchor="middle">Runs Fri 07:00</text>
  </g>
  <g transform="translate(988 232)">
    <rect width="152" height="110" rx="14" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="76" y="52" fill="#9b9bb8" font-size="12" text-anchor="middle">Weekly recap</text>
    <text x="76" y="72" fill="#6b6b88" font-size="11" text-anchor="middle">Auto-summarized</text>
  </g>

