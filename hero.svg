      <rect x="9" y="9" width="16" height="16" rx="5" fill="none" stroke="#ecebff" stroke-width="2"/>
      <circle cx="17" cy="17" r="4" fill="none" stroke="#ecebff" stroke-width="2"/>
    </g>
    <g transform="translate(42 14)">
