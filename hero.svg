    <rect x="12" y="14" width="124" height="7" rx="3.5" fill="#ecebff" opacity="0.8"/>
    <rect x="12" y="28" width="108" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="42" width="128" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="56" width="72" height="7" rx="3.5" fill="#ecebff" opacity="0.45"/>
    <rect x="12" y="84" width="54" height="18" rx="9" fill="#22c55e" opacity="0.18"/>
